  move-not-empty: The chosen folder must be empty
  move-failed:    Copying failed, the data stays where it was
  move-old-kept:  Moved, but the old folder could not be removed
  move-done:      Moved

  user-data:
    title: Export and import
    help:  Packs the checked categories into a zip file, or brings such a file back in.
    playlists:   Playlists
    likes:       Likes
    history:     History
    tunes:       My tunes
    themes:      Themes
    crt:         CRT overlays, masks and presets
    preferences: Preferences
    file:    "{} file"
    files:   "{} files"
    entry:   "{} entry"
    entries: "{} entries"
    none:    empty
    export: Export...
    import: Import...
    export-title:  Export my data
    import-title:  Import my data
    exported:      "{} files exported"
    export-failed: Export failed
    nothing-checked:  Nothing is checked
    not-archive:      Not an ultraSID data archive
    nothing-selected: The archive holds none of the checked categories
    import-message: "Import {} from the archive? Merge keeps what you have and adds the archive's content, replace clears those categories first."
    merge:   Merge
    replace: Replace
    cancel:  Cancel
    imported:      "{} files imported"
    import-failed: Import failed

  player:
    normalize: Normalize volume
    normalize-help: Play all tunes at a consistent volume.

  sound_output: Sound output device

  eq:
    label: Tone adjustment
    help:  Adjust the sound to taste.
    low:   LOW
    mid:   MID
    high:  HIGH
    handle: "{:+.1f} dB"

  theme: Theme

  boot-screen: Boot screen

  player-screen: Player screen
  player-screen-random: Random

  songs:
    unknown:        Unknown tune length
    unknown-help:   How long to play a tune with no known length, in minutes.

    fade-out:       Fade out
    fade-out-help:  Seconds spent fading to silence at the end.

    minimum:        Minimum length
    minimum-help:   Play each tune for at least this many seconds.

    max-loops:      Maximum repeats
    max-loops-help: How many times a tune may repeat before moving on.

  emulation:
    dac-leakage:      6581 DAC leakage
    dac-leakage-help: Emulates how 6581 voices never fall completely silent.

  fx:
    stereo-processing:      Stereo placement
    stereo-processing-help: Applies curated stereo width to multi-chip tunes that suit it; the rest stay mono.

    transition-time:      Quality transition time
    transition-time-help: Seconds per step when switching audio quality. 0 is instant.

  export:
    format:      File format
    format-help: WAV and FLAC are lossless, OGG is small with excellent quality.

    normalize:      Normalize volume
    normalize-help: Boost each file to full volume before saving.

    name-template:      File names
    name-template-help: "{A} author, {T} title, {R} release, {Y} year, {Q} quality, {N} subtune, {NN} and {NNN} zero-padded."
    name-template-invalid: Invalid pattern

  ui:
    keep-screen-awake:      Keep screen awake
    keep-screen-awake-help: Stops the screensaver and display sleep while ultraSID is in focus.

  update:
    check:                Check for updates online
    check-help:           Asks the website for a newer version when ultraSID starts.
    check-frequency:      Check frequency
    check-frequency-help: How often ultraSID asks the website for a newer version.
    check-frequency-daily:   Daily
    check-frequency-weekly:  Weekly
    check-frequency-monthly: Monthly

  shortcuts:
    title:  Keyboard shortcuts
    help:   Every key the player listens to, also on ? or Ctrl+/
    button: Show shortcuts

  install:
    title: Start menu and program folder
    help:  Adds a Start menu entry, or moves to Programs first.
    shortcut: Add to Start menu
    move:     Move to Programs
    shortcut-done:   Start menu entry created
    shortcut-failed: Could not create the Start menu entry
    move-title:   Move ultraSID?
    move-message: "ultraSID moves to {}, gets a Start menu entry and restarts from there. Continue?"
    move-failed:  Could not move the program, it stays where it is

# Onboarding / HVSC install + update screens
install:
  welcome_header:    Welcome to ultraSID
  installing_header: Installing HVSC
  update_header:     HVSC is outdated
  updating_header:   Updating HVSC
  canceling:         Canceling...
  replace_title:     Replace the existing folder?
  replace_message:   {} already exists and everything in it will be deleted before the HVSC is installed. Continue?

#
# Confirmations
#
quit:
  title:   Quit ultraSID?
  message: Exports are still running, quit anyway?

#
# Onboarding screen
#
onboarding_welcome: |
  This SID player requires a copy of the High Voltage SID Collection (HVSC).

  If you already have downloaded and extracted a copy of the HVSC, then please specify the location of your HVSC folder below.

  If you do not have a copy of HVSC, ultraSID can download and install it for you.

#
# Update HVSC screen
#
update_hvsc_welcome: |
  Your copy of the HVSC is outdated.

  Would you like to update to the latest version of the HVSC automatically?

