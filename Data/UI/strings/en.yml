    user-data: My Data
    playback: Playback
    song-lengths: Song Lengths
    emulation: SID Emulation
    audio-fx: Audio Enhancements
    export: Export
    user-interface: User Interface
    updates: App Updates
    keyboard: Keyboard
    install: Start Menu

settings:
