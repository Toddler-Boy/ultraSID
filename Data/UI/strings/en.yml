#
# This is not a full-fledged YAML file.
# The parser will fail if you go beyond this extremely simple format.
#
main-menu:
  search:     Search
  playlists:  Playlists
  crt:        CRT
  export:     Export
  history:    History
  settings:   Settings

# Chip
chip:
  approved: Approved by {}
  sid6581_profile_tip: Excellent 6581 emulation
  sid8580_profile_tip: Excellent 8580 emulation

# Memory overview; the tooltip strings are fmt patterns, "{}" and friends
# get the values filled in
memory:
  nothing_loaded_tip: No SID tune loaded
  load_address: "Load address: ${:04X} - ${:04X} (length {})"
  init_address: "Init address : ${:04X}"
  basic_program: Basic Program
  play_address: "Play address : ${:04X}"
  playroutine: "Playroutine: {}"

# Footer
footer:
  quality:
    header: Audio Quality
    real:   Filtered through a tiny 1084 speaker, with distortion, transformer hum and hiss added.
    pure:   Faithful machine output. Nothing added, only inaudible subsonics removed.
    magic:  Mild stereo widening, light delay & reverb and a gentle bass shelf. Recommended.
    epic:   Heavy stereo widening, deep delay & reverb and bold bass. Not for the faint-hearted.
    mythic: Everything cranked to 11. Maximum width, endless echoes, cavernous reverb.

  volume:
    mute_tip:   Mute
    unmute_tip: Unmute

  quality_tip:  Audio quality settings

  play_tip:               Play
  pause_tip:              Pause
  previous_tip:           Previous
  next_tip:               Next
  enable_repeat_all_tip:  Repeat
  enable_repeat_one_tip:  Repeat
  disable_repeat_tip:     Repeat one
  enable_shuffle_tip:     Shuffle
  disable_shuffle_tip:    Shuffle

# STIL
stil:
  toggle:
    tunes_only: Tunes only
    tunes_only_tip: Toggles Stingers / FX
    stil: Notes
    stil_tip: Toggles STIL notes
    viz: Chips
    viz_tip: Keeps the chip display visible even when the notes need the space

# Color adjustments
color-adjust:
  gamma:      Gamma
  brightness: Brightness
  contrast:   Contrast
  saturation: Saturation
  reset:      Reset

# Context menus
menu:
  add_to_playlist:      Add to playlist
  remove_from_playlist: Remove from this playlist
  move_to_top:          Move to top
  move_to_bottom:       Move to bottom
  new_playlist:         New playlist
  delete_playlist:      Delete playlist
  delete_cover:         Delete cover-image
  go_to_folder:         Go to folder
  toggle_tag:           Toggle tag
  export_tune:          Export tune
  export_tunes:         Export tunes
  export_playlist:      Export playlist
  cancel_export:        Cancel export of this tune
  cancel_exports:       Cancel export of these tunes
  remove_from_history:  Remove from history
  clear_older:          Clear older than
  older_1_month:        1 month
  older_3_months:       3 months
  older_6_months:       6 months
  older_1_year:         1 year
  clear_history:        Clear history
  clear_all:            Clear all
  export_canceled:      Export canceled tunes
  show_in_explorer:     Show in Explorer
  show_in_finder:       Show in Finder
  show_in_file_manager: Show in file manager

# Undo toasts
toast:
  undo:             Undo
  playlist_deleted: Playlist "{}" deleted
  tune_removed:     Tune removed
  tunes_removed:    "{} tunes removed"
  cover_deleted:    Cover-image deleted

# Search
search:
  prompt:     What do you want to listen to?
  empty:      No tunes match your search
  no_results: No results
  result:     "{} result"
  results:    "{} results"

  tag:
    pioneers:     Pioneers
    pioneers_tip: The composers who pushed the SID chip forward and shaped its sound.

    gems:     Gems
    gems_tip: My personal pick of standout tunes.

    winners:     Winners
    winners_tip: Placed top three in a scene music competition.

    liked:      Liked
    liked_tip:  Tunes you've liked.

  no_exact_like_tip: |
    You liked a different tune in this file, not the one that plays by default.
    Click to like the default tune too.

# Playlist
playlist:
  my_playlists:     My Playlists
  default_name:     My Playlist #1
  empty:            This playlist is empty

  add_playlist_tip: Add new playlist
  back_tip:         Back to playlist grid
  menu_tip:         Playlist options

# Export
export:
  header:   Export queue
  empty:    You haven't exported anything yet
  menu_tip: Export options

  status:
    new:          New
    rendering:    Rendering
    applying_fx:  Applying FX
    saving:       Saving
    complete:     Complete
    canceled:     Canceled
    paused:       Paused
    error:        Can't write to path

# History
history:
  header:   History
  menu_tip: History options
  empty:    You haven't played anything yet

# The crt/settings strings live in UI/strings/crt-settings.yml (configure-synced
# from the ultra-shared submodule); Strings appends them to this file

# Settings
